name: glama-build-and-release-gate

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "README.md"]
  pull_request:
    paths-ignore: ["docs/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: |
          pip install -e '.[dev]'
          python -m pytest tests/ -q

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          # Deliberate: base-image pin warnings (DL3008/DL3013/DL3042) must not block the gate.
          failure-threshold: error

      - name: Build Docker image (Glama fires a plain build)
        run: docker build -t gh-workflow-fix-mcp:ci .

      - name: MCP smoke test inside image (tools/list via stdio)
        run: |
          docker run --rm \
            -v "$PWD/scripts/mcp-smoke.py:/app/scripts/mcp-smoke.py:ro" \
            -e GH_TOKEN=smoke-token \
            -e GH_REPO=acme/app \
            -e GH_OC_AUTO=true \
            -e WEBHOOK_SECRET=smoke-secret \
            -e DATA_DIR=/tmp/gh-workflow-fix-smoke \
            --entrypoint /app/.venv/bin/python \
            gh-workflow-fix-mcp:ci \
            scripts/mcp-smoke.py 8

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' pyproject.toml | head -1)"
          echo "tag=${TAG} package=${PKG_VERSION}"
          if [ -z "$PKG_VERSION" ]; then
            echo "::error::Could not read version from pyproject.toml"
            exit 1
          fi
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag version '${TAG}' does not match package version '${PKG_VERSION}'"
            exit 1
          fi

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
